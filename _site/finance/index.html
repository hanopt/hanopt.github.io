  <h1 style="margin:0 0 .5rem">Live Finance</h1>
  <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;margin:.5rem 0 1rem">
    <label>Symbol</label>
    <input id="symbol" value="AAPL" style="padding:.5rem;border:1px solid #d1d5db;border-radius:10px;min-width:120px">
    <label>Resolution</label>
    <select id="res" style="padding:.5rem;border:1px solid #d1d5db;border-radius:10px">
      <option>1</option><option selected>5</option><option>15</option><option>30</option><option>60</option>
      <option>D</option><option>W</option><option>M</option>
    </select>
    <button id="load" style="padding:.5rem .9rem;border:1px solid #d1d5db;border-radius:999px;background:#111827;color:#fff;cursor:pointer">
      Load
    </button>
    <div id="last" style="margin-left:auto;font-weight:600">—</div>
  </div>

  <div id="chart" style="height:420px"></div>

<link rel="preconnect" href="https://unpkg.com">
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<script>
const PROXY = "https://empty-boat-e6d0.e-krutitsky.workers.dev"; // ← your Worker URL

function unixSec(d){ return Math.floor(d.getTime()/1000); }
async function j(u){ const r = await fetch(u, { cache: 'no-store' }); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function loadQuote(sym){
  return j(`${PROXY}/quote?symbol=${encodeURIComponent(sym)}`);
}
async function loadCandles(sym, res){
  const now = new Date();
  const from = new Date(Date.now() - (res==='D'||res==='W'||res==='M' ? 200 : 2)*24*3600*1000);
  const url = `${PROXY}/candles?symbol=${encodeURIComponent(sym)}&resolution=${encodeURIComponent(res)}&from=${unixSec(from)}&to=${unixSec(now)}`;
  const out = await j(url);
  return out.candles || [];
}

(async function main(){
  const chart = LightweightCharts.createChart(document.getElementById('chart'), { height: 420, autoSize: true });
  const series = chart.addCandlestickSeries();

  const symbolEl = document.getElementById('symbol');
  const resEl = document.getElementById('res');
  const lastEl = document.getElementById('last');

  async function render(){
    const sym = symbolEl.value.trim().toUpperCase();
    const res = resEl.value;
    const [quote, candles] = await Promise.all([loadQuote(sym), loadCandles(sym, res)]);
    series.setData(candles.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));

    const p = Number(quote.price), d = Number(quote.change), dp = Number(quote.changePct);
    lastEl.textContent = isFinite(p) ? `${sym}: ${p.toFixed(2)} (${d>=0?'+':''}${d.toFixed(2)}, ${dp>=0?'+':''}${dp.toFixed(2)}%)` : `${sym}: —`;
  }

  await render();
  setInterval(render, 30_000);
  document.getElementById('load').onclick = render;

  new ResizeObserver(() => chart.timeScale().fitContent()).observe(document.getElementById('chart'));
})();
</script>
